name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Если gdz.db уже лежит в корне репозитория, используем его.
      # Иначе скачиваем asset из GitHub Release.
      - name: Get database
        env:
          DB_URL: https://github.com/eurogazz/gdz-app/releases/latest/download/gdz.db
        run: |
          set -euo pipefail
          if [ ! -s gdz.db ]; then
            echo "gdz.db не найден в корне репозитория — скачиваю из Release"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$DB_URL" --output gdz.db
          else
            echo "Использую gdz.db из репозитория"
          fi
          test -s gdz.db
          echo "Размер базы: $(stat -c%s gdz.db) bytes"

      - name: Validate SQLite database
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('file:gdz.db?mode=ro', uri=True)
          result = db.execute('PRAGMA quick_check').fetchone()[0]
          assert result == 'ok', f'SQLite quick_check failed: {result}'
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'books', 'tasks'} <= tables, f'Missing tables: {tables}'
          books = {r[1] for r in db.execute('PRAGMA table_info(books)')}
          tasks = {r[1] for r in db.execute('PRAGMA table_info(tasks)')}
          assert {'id', 'class', 'subject', 'author', 'title', 'cover'} <= books, f'Unexpected books schema: {books}'
          assert {'id', 'book_id', 'number', 'solution', 'image_url'} <= tasks, f'Unexpected tasks schema: {tasks}'
          print('Database OK:', db.execute('SELECT COUNT(*) FROM books').fetchone()[0], 'books;',
                db.execute('SELECT COUNT(*) FROM tasks').fetchone()[0], 'tasks')
          db.close()
          PY

      - name: Build with Buildozer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Verify APK contains the database
        run: |
          python3 - <<'PY'
          import io
          import pathlib
          import tarfile
          import zipfile

          apks = list(pathlib.Path('bin').glob('*.apk'))
          assert apks, 'APK не создан'

          def find_db_in_tar(data, label):
              try:
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as archive:
                      for member in archive.getmembers():
                          if pathlib.PurePosixPath(member.name).name == 'gdz.db' and member.isfile():
                              return f'{label} -> {member.name}'
                          if member.isfile() and member.size > 0:
                              nested = archive.extractfile(member)
                              if nested:
                                  result = find_db_in_tar(nested.read(), f'{label} -> {member.name}')
                                  if result:
                                      return result
              except (tarfile.TarError, OSError, EOFError):
                  pass
              return None

          found_at = None
          for apk_path in apks:
              with zipfile.ZipFile(apk_path) as apk:
                  for name in apk.namelist():
                      if pathlib.PurePosixPath(name).name == 'gdz.db':
                          found_at = f'{apk_path}: {name}'
                          break
                      try:
                          payload = apk.read(name)
                      except (KeyError, RuntimeError):
                          continue

                      # python-for-android stores app files in assets/private.tar.
                      # Older packaging layouts may use private.mp3.
                      result = find_db_in_tar(payload, f'{apk_path}: {name}')
                      if result:
                          found_at = result
                          break
              if found_at:
                  break

          if not found_at:
              print('Содержимое APK:')
              for apk_path in apks:
                  with zipfile.ZipFile(apk_path) as apk:
                      for name in apk.namelist():
                          print(' -', name)
              raise SystemExit(
                  'ОШИБКА: gdz.db действительно не найдена в APK или assets/private.tar. '
                  'Проверь source.include_exts и source.include_patterns в buildozer.spec.'
              )

          print('OK: gdz.db найдена:', found_at)
          PY

      - name: Give permissions for APK
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gdz-apk
          path: bin/*.apk
